version: '3.8'

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    ports:
      - "8333:8333" # S3 API port
      - "9333:9333" # Master port
      - "8888:8888" # Filer
    command: "server -s3 -filer -dir=/data"
    volumes:
      - seaweed_data:/data
      - ./s3.json:/data/s3.json:ro

  postgres:
    image: postgres:15-alpine
    container_name: mlflow_postgres
    environment:
      POSTGRES_USER: mlflow_user
      POSTGRES_PASSWORD: mlflow_password
      POSTGRES_DB: mlflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow_server
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=any
      - AWS_SECRET_ACCESS_KEY=any
      - MLFLOW_S3_ENDPOINT_URL=http://seaweedfs:8333
      - AWS_S3_ADDRESSING_STYLE=path
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow_user:mlflow_password@postgres:5432/mlflow_db
      --host 0.0.0.0
      --serve-artifacts
      --artifacts-destination s3://mlflow-artifacts
      --port 5000
    depends_on:
      - postgres
      - seaweedfs

volumes:
  seaweed_data:
  postgres_data:
