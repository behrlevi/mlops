stages:
  ingest:
    cmd: python3 src/data/ingest.py
    deps:
      - src/data/ingest.py
      - data/raw/data.csv
  validate:
    cmd: python3 src/data/validate.py
    deps:
      - data/raw/data.csv
      - src/data/validate.py
    outs:
      - reports/validation.json:
          cache: false
  preprocess:
    cmd: python3 src/data/preprocess.py
    deps:
      - data/raw/data.csv
      - src/data/preprocess.py
    outs:
      - data/processed/clean.csv
#  split_data:
#    cmd: python3 src/data/split_data.py
#    deps:
#      - data/processed/clean_transactions.csv
#      - src/data/split_data.py
#    outs:
#      - data/processed/train.csv
#      - data/processed/test.csv
  train:
    cmd: python3 src/data/train.py
    deps:
      - data/processed/clean.csv
      - src/data/train.py
    params:
      - n_estimators
      - max_depth
      - test_size
      - random_seed
    outs:
      - models/model.pkl
    metrics:
      - metrics.json:
          cache: false
  evaluate:
    cmd: python3 src/data/evaluate.py
    deps:
      - models/model.pkl
      - data/processed/test_split.csv
      - src/data/evaluate.py
    outs:
      - reports/evaluation.json:
          cache: false
