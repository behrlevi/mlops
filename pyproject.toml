[project]
name = "fraud-detection"
version = "0.1.0"
dependencies = [
    "scikit-learn",
    "pandas",
    "mlflow",
    "dvc[s3]",
    "optuna",
    "pyyaml",
    "jupyterlab",
    "boto3",
    "awscli",
    "numpy"
]

[project.optional-dependencies]
tools = [
    "pre-commit",
    "ruff",
    "black",
    "pytest",
    "build",
    "cookiecutter"
]

[tool.ruff]
line-length = 120
extend-exclude = ["jupyter_lab_config.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 120

[tool.setuptools.packages.find]
where = ["src"]

# Picked up by the python3 -m pytest tests/ -q command
[tool.pytest.ini_options]
pythonpath = ["src"]

# Picked up by python3 -m build
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
