[project]
name = "fraud-detection"
version = "0.1.0"
dependencies = [
    "scikit-learn",
    "pandas",
    "mlflow",
    "dvc[s3]",
    "optuna",
    "pyyaml",
    "jupyterlab"
]

[project.optional-dependencies]
devops = [
    "pre-commit",
    "ruff",
    "black"
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
extend-exclude = ["jupyter_lab_config.py"]

[tool.black]
line-length = 88
